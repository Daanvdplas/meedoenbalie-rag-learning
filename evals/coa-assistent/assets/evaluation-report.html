<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-report-controls'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Wat laten de tests zien? · Activiteiten</title>
  <style>
    :root{color-scheme:light;--paper:oklch(98% .008 90);--ink:oklch(27% .025 160);--muted:oklch(44% .02 160);--line:oklch(83% .02 160);--green:oklch(38% .065 155);--good:oklch(94% .035 155);--blue:oklch(95% .018 235);--amber:oklch(96% .035 85);--red:oklch(95% .025 30);--space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:40px}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.5 "Avenir Next","Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:32px 24px 48px}h1,h2{font-family:"Iowan Old Style",Palatino,serif;font-weight:500;line-height:1.15;letter-spacing:-.025em}h1{font-size:2.75rem;margin:8px 0 12px}h2{font-size:1.9rem;margin:0 0 16px}h3{font-size:1.1rem;margin:0 0 12px}h4{font-size:1rem;margin:0 0 8px}p{max-width:75ch;margin:0 0 12px}small,.help,.question-meta,.report-count,footer{font-size:.875rem;color:var(--muted)}small{overflow-wrap:anywhere}.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:var(--green);margin:0}.lead{font-size:1.1rem}.calibration{font-size:.875rem;margin:0}.example{background:var(--amber);border:1px solid oklch(79% .06 85);border-radius:6px;padding:12px 16px;margin:24px 0 16px}.example p{font-size:.875rem;margin:4px 0 0}.report-count{margin:20px 0}main>section{margin-top:32px}section>h3:not(:first-child){margin-top:24px}.table-scroll{overflow-x:auto;margin-bottom:12px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.875rem}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:right}th:first-child{text-align:left;min-width:230px}thead th{font-weight:600;color:var(--muted);font-size:.75rem;white-space:nowrap}tbody th{font-weight:650}tbody tr:hover{background:var(--blue)}td.total{font-weight:750}td.good{color:oklch(33% .08 155)}td.bad,td.failed{color:oklch(41% .1 30)}td.review{color:oklch(43% .07 75)}.help{max-width:80ch}#filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:flex;flex-direction:column;gap:4px;font-size:.875rem;font-weight:650;flex:1 1 180px}select,button{font:inherit;color:inherit;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:5px;background:var(--paper)}select{min-width:0;width:100%}button{cursor:pointer}button:hover{background:var(--good)}:focus-visible{outline:3px solid var(--green);outline-offset:3px}#filter-count{font-size:.875rem;margin:12px 0}#no-results{background:var(--blue);padding:16px}.question{border:1px solid var(--line);border-radius:6px;margin-bottom:12px;background:oklch(99% .005 90)}.question>summary{padding:16px;display:flex;align-items:start;justify-content:space-between;gap:24px;list-style:none;min-height:70px}.question>summary::-webkit-details-marker{display:none}.question>summary:after{content:"+";font-size:1.5rem;line-height:1}.question[open]>summary:after{content:"−"}.question>summary>span:first-child{flex:1;min-width:0}.question-text{display:block;font-weight:650;font-size:1rem;overflow-wrap:anywhere}.question-meta{display:block;margin-top:4px;font-size:.75rem;font-weight:500}.question[open]>summary{background:var(--blue);border-radius:5px 5px 0 0}.question-body{padding:16px}.badge{display:inline-block;width:fit-content;border-radius:4px;padding:3px 8px;font-size:.75rem;font-weight:650;line-height:1.5;white-space:normal;flex-shrink:0}.badge.good{background:var(--good);color:oklch(33% .07 155)}.badge.bad,.badge.failed{background:var(--red);color:oklch(39% .09 30)}.badge.review{background:var(--amber);color:oklch(41% .07 75)}.badge.neutral,.badge.not_run{background:oklch(93% .012 235);color:oklch(38% .025 235)}.answer-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.answer-box,.expected{padding:16px;border:1px solid var(--line);border-radius:5px;min-width:0}.answer-box{background:var(--amber)}.expected{background:var(--blue)}.answer{font-size:1.05rem;white-space:pre-wrap;overflow-wrap:anywhere}.facts{margin:0;padding:0;list-style:none}.facts li+li{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.facts p{font-size:.875rem;margin:6px 0 2px}.facts small{display:block;font-size:.75rem}.expected>.help{margin:12px 0 0;font-size:.75rem}.measure-strip{display:flex;gap:16px 24px;flex-wrap:wrap;margin:24px 0;padding:16px 0;border-block:1px solid var(--line);font-variant-numeric:tabular-nums}.measure-strip>div{flex:1 1 130px}.measure-strip dt{font-size:.75rem;color:var(--muted)}.measure-strip dd{font-weight:650;margin:4px 0 0}.assessment{margin:0 0 20px}.assessment p{font-size:.875rem}details>summary{cursor:pointer}details:not(.question){border-top:1px solid var(--line);padding:12px 0}details:not(.question)>summary{font-weight:650;min-height:32px}details:not(.question)>summary+*{margin-top:12px}.checks{list-style:none;padding:0;margin:0}.checks li{padding:12px 0;border-top:1px solid var(--line)}.checks li:first-child{border-top:0;padding-top:0}.checks .badge{margin-right:8px}.checks p{margin:6px 0 0}.source{background:var(--good);border:1px solid var(--line)!important;border-radius:4px;padding:8px 12px!important;margin-top:8px}.source summary small{display:block;font-size:.75rem;font-weight:500}.source p{font-size:.875rem;white-space:pre-wrap;overflow-wrap:anywhere}.citation{background:oklch(89% .045 155);padding:12px}.search-step{margin:12px 0 24px}.search-step>p{font-size:.875rem;overflow-wrap:anywhere}.hit-line{padding:8px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}.hit-line strong{font-size:.875rem}.hit-line small{font-size:.75rem}.all-metrics{margin:0}.all-metrics>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 0;border-top:1px solid var(--line)}.all-metrics dt{font-size:.875rem;overflow-wrap:anywhere}.all-metrics dd{margin:0;font-weight:650;font-variant-numeric:tabular-nums}.all-metrics p{grid-column:1/-1;font-size:.875rem;overflow-wrap:anywhere;margin:0}.metadata{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 16px;font-size:.875rem}.metadata dt{font-weight:650}.metadata dd{margin:0;overflow-wrap:anywhere}.method{margin-top:32px}.method p{font-size:.875rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.skip{position:absolute;left:12px;top:-100px;background:var(--paper);padding:12px}.skip:focus{top:12px}footer{border-top:1px solid var(--line);padding-top:16px;margin-top:32px;font-size:.75rem}[hidden]{display:none!important}
    .scroll-hint{display:none;font-size:.875rem;color:var(--muted)}.paired{min-width:1040px;table-layout:fixed}.paired th,.paired td{text-align:left;vertical-align:top}.paired th:first-child{width:28%;min-width:0}.paired td strong,.paired td small{display:block;margin-top:6px;white-space:normal;overflow-wrap:anywhere}.paired td strong{font-size:.875rem}.paired td small{font-size:.75rem}.pair-link{display:inline-flex;align-items:center;min-height:44px;color:inherit;text-decoration:underline;text-underline-offset:3px}
    @media(max-width:650px){main{padding:24px 16px 32px}h1{font-size:2.1rem}h2{font-size:1.6rem}.scroll-hint{display:block}.answer-grid{grid-template-columns:1fr}.question>summary{gap:8px;padding:12px;flex-wrap:wrap}.question>summary>span:first-child{flex-basis:100%}.question>summary:after{margin-left:auto}.question-body{padding:12px}.question-meta{line-height:1.6}.metadata{grid-template-columns:1fr;gap:4px}.metadata dd{margin-bottom:8px}.all-metrics>div{grid-template-columns:1fr}.all-metrics dd{text-align:left}.measure-strip{gap:16px}.table-scroll{margin-right:-16px}.answer-box,.expected{padding:12px}}
    @media print{#filters,#filter-count,.skip{display:none}.question{break-inside:avoid}.table-scroll{overflow:visible}main{max-width:none}}
  </style>
</head>
<body>
  <a href="#questions-title" class="skip">Naar de vragen</a>
  <main><!-- REPORT --></main>
  <script nonce="report-controls">
    const form=document.querySelector('#filters');
    const rows=[...document.querySelectorAll('.question')];
    const count=document.querySelector('#filter-count');
    document.querySelectorAll('time[data-epoch-ms]').forEach(time=>{const value=new Date(Number(time.dataset.epochMs));if(Number.isFinite(value.getTime())){time.dateTime=value.toISOString();time.textContent=value.toISOString().replace('T',' ').replace('.000Z',' UTC').replace('Z',' UTC');}});
    function filter(){
      const selected={arm:form.querySelector('#arm').value,kind:form.querySelector('#kind').value,outcome:form.querySelector('#outcome').value,split:form.querySelector('#split').value};
      let shown=0;
      for(const row of rows){const visible=Object.entries(selected).every(([key,value])=>!value||row.dataset[key]===value);row.hidden=!visible;if(!visible)row.open=false;if(visible)shown++;}
      count.textContent=`${shown} van ${rows.length} uitvoeringen zichtbaar`;
      document.querySelector('#no-results').hidden=shown>0;
    }
    form.addEventListener('change',filter);
    form.addEventListener('submit',event=>event.preventDefault());
    form.addEventListener('reset',()=>setTimeout(filter,0));
    document.querySelectorAll('[data-open]').forEach(link=>link.addEventListener('click',()=>{form.reset();setTimeout(()=>{const question=document.getElementById(link.dataset.open);question.hidden=false;question.open=true;question.querySelector('summary').focus();question.scrollIntoView({block:'start'});},0);}));
    filter();
  </script>
</body>
</html>
