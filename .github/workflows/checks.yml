name: Rust checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: Rust checks (${{ matrix.storage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - storage: documents
            flags: --no-default-features
          - storage: sqlite
            flags: --no-default-features --features sqlite
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.97.1 fmt --all --check
      - name: Lints
        run: cargo +1.97.1 clippy --locked --all-targets ${{ matrix.flags }} -- -D warnings
      - name: Deterministic tests (no embedding model download)
        run: cargo +1.97.1 test --locked ${{ matrix.flags }}
      - name: Build
        run: cargo +1.97.1 build --locked ${{ matrix.flags }}
      - name: Python budget and public-export checks (no model calls)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
